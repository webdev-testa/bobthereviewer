[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bobthereviewer"
version = "0.1.0"
description = "Find what a code change actually affects and whether the difference was intentional"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "pytest-json-report>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "jsonschema>=4.21",
    "pytest-json-report>=1.5",
]

[project.scripts]
bobreviewer = "bobthereviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bobthereviewer*"]

[tool.setuptools.package-data]
"bobthereviewer" = [
    "py.typed",
    "frontend/**/*",
    "frontend/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: end-to-end tests that require demo Git tags and worktree checkout",
]
