name: Behavior Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  TOOL_REF: v0.1.2

jobs:
  behavior-review:
    name: Run Behavior Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for worktrees)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and bobthereviewer
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
          pip install "git+https://github.com/webdev-testa/bobthereviewer@${TOOL_REF}"

      - name: Run behavior review
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p output
          set +e
          bobreviewer run \
            --before "$BASE_SHA" \
            --after "$HEAD_SHA" \
            --output output/
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobreviewer-pr-${{ github.event.pull_request.number }}
          path: |
            output/evidence.json
            output/repo_map.json
            output/report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MARKER = '<!-- bobreviewer-comment -->';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const exitCode = '${{ steps.review.outputs.exit_code }}';
            const evidenceExists = fs.existsSync('output/evidence.json');

            let body;
            if (exitCode !== '0' || !evidenceExists) {
              body = [
                MARKER,
                '## ❌ Behavior Review Failed',
                '',
                `The behavior review CLI exited with code \`${exitCode}\`. See the [full run log](${runUrl}) for details.`,
                '',
                '> Installation or execution failures cannot masquerade as a passing report.',
              ].join('\n');
            } else {
              const reportPath = 'output/report.md';
              const reportMd = fs.existsSync(reportPath)
                ? fs.readFileSync(reportPath, 'utf8')
                : '_Report not generated — see run log._';
              body = [
                MARKER,
                reportMd,
                '',
                '---',
                `📎 **Artifact:** \`bobreviewer-pr-${{ github.event.pull_request.number }}\` · 🔗 [Full CI run](${runUrl})`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
